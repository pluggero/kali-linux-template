### Locale and Language
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i clock-setup/utc boolean true
d-i time/zone string US/Central

### Keyboard
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layoutcode string us

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string kali-cleanroom
d-i netcfg/get_domain string local.lan

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/http/proxy string

### APT
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/use_mirror boolean true

### Root Account
d-i passwd/root-login boolean true
d-i passwd/root-password password RootSuperSecureTemp!
d-i passwd/root-password-again password RootSuperSecureTemp!

### User Account
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Kali user
d-i passwd/username string kali
d-i passwd/user-password password KaliSuperSecureTemp!
d-i passwd/user-password-again password KaliSuperSecureTemp!
d-i user-setup/encrypt-home boolean false
d-i user-setup/allow-password-weak boolean false
d-i passwd/user-default-groups string audio cdrom video admin sudo

### Partitioning (QEMU VirtIO disk)
d-i partman-auto/disk string /dev/vda
d-i partman-partitioning/default_label string gpt
d-i partman-auto/method string lvm

# Wipe old metadata
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/purge_lvm_from_device boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Create VG and take the whole disk
d-i partman-auto-lvm/new_vg_name string vg
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/no_boot boolean false

# Custom partitioning recipe for QEMU (UEFI/GPT + LVM)
d-i partman-auto/expert_recipe string                           \
  boot-lvm ::                                                   \
    512 512 512 fat32                                           \
      $iflabel{ gpt }                                           \
      $primary{ }                                               \
      method{ efi } format{ }                                   \
      mountpoint{ /boot/efi }                                   \
    .                                                           \
    1024 1024 1024 ext4                                         \
      $primary{ }                                               \
      $bootable{ }                                              \
      method{ format } format{ }                                \
      use_filesystem{ } filesystem{ ext4 }                      \
      mountpoint{ /boot }                                       \
    .                                                           \
    1 1 -1 lvm                                                  \
      $primary{ }                                               \
      method{ lvm }                                             \
      vg_name{ vg }                                             \
    .                                                           \
    8192 8192 8192 linux-swap                                   \
      $lvmok{ }                                                 \
      in_vg{ vg }                                               \
      lv_name{ swap }                                           \
      method{ swap } format{ }                                  \
    .                                                           \
    10240 10240 -1 ext4                                         \
      $lvmok{ }                                                 \
      in_vg{ vg }                                               \
      lv_name{ root }                                           \
      method{ format } format{ }                                \
      use_filesystem{ } filesystem{ ext4 }                      \
      mountpoint{ / }                                           \
    .

# Select recipe
d-i partman-auto/choose_recipe select boot-lvm

# Confirmations
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/choose_partition select finish
d-i partman-basicfilesystems/no_mount_point boolean false

### Package Selection
# https://gitlab.com/kalilinux/packages/tasksel/-/tree/kali/master/kali-tasks
tasksel tasksel/first multiselect core
d-i pkgsel/include string openssh-server sudo network-manager # Default packages
d-i pkgsel/install-language-support boolean false
d-i pkgsel/update-policy select none
d-i pkgsel/upgrade select full-upgrade

### UEFI Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/password password GrubSecret!
d-i grub-installer/password-again password GrubSecret!
d-i grub-installer/force-efi-extra-removable boolean true

### Post-install Configuration
d-i preseed/late_command string \
  in-target systemctl enable ssh; \
  in-target systemctl enable NetworkManager

### Final Reboot
d-i finish-install/reboot_in_progress note

[pytest]
# Pytest configuration for Kali Linux VM testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals

# Markers
markers =
    critical: Critical tests that must pass
    security: Security-related tests
    network: Network-related tests
    slow: Slow-running tests
    role: Role-specific tests from ansible configuration
    integration: Integration tests for overall system functionality

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if using pytest-cov)
# [tool:pytest]
# addopts = --cov=. --cov-report=html --cov-report=term

# Timeout (if using pytest-timeout)
# timeout = 300
# timeout_method = thread
